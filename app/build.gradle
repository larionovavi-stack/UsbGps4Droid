apply plugin: 'com.android.application'
android {
    namespace 'org.broeuschmeul.android.gps.usb.provider'
    compileSdk 35
    defaultConfig {
        applicationId "org.broeuschmeul.android.gps.usb.provider"
        minSdk 24
        targetSdk 34

        versionCode 201
        versionName "v3.0.1"
        vectorDrawables.useSupportLibrary = true

        setProperty("archivesBaseName", "UsbGps4Droid-$versionName")
    }

    applicationVariants.all { variant ->
        variant.resValue "string", "version_name", variant.versionName
    }

    signingConfigs {
        release {
            storeFile file("../locationbroker.jks")
            storePassword "locationbroker2026"
            keyAlias "upload"
            keyPassword "locationbroker2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    productFlavors {
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.3'
}
